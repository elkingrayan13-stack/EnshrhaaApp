name: Build Enshrhaa APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q EnshrhaaApp.zip -d project
          echo "Project files:"
          find project -maxdepth 3 -type f | head -50

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
- name: Build APK
  run: |
    cd "$(dirname "$(find project -name settings.gradle.kts -print -quit)")"
    gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Enshrhaa-debug-apk
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
