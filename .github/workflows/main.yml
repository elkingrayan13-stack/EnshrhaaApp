name: Build Enshrhaa APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir -p project
          unzip -q EnshrhaaApp.zip -d project

          echo "Project files:"
          find project -maxdepth 5 -type f | head -100

      - name: Fix Android Gradle dependencies
        run: |
          APP_GRADLE="$(find project -path "*/app/build.gradle.kts" -print -quit)"

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle.kts was not found"
            find project -type f -name "build.gradle.kts" -print
            exit 1
          fi

          echo "Updating:"
          echo "$APP_GRADLE"

          cat > "$APP_GRADLE" <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.inshrha.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.inshrha.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))

              implementation("androidx.activity:activity-compose:1.10.0")

              implementation("androidx.compose.ui:ui:1.7.6")
              implementation("androidx.compose.ui:ui-tooling-preview:1.7.6")

              implementation("androidx.compose.material3:material3:1.3.1")

              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")

              implementation("androidx.core:core-ktx:1.15.0")
          }
          EOF

          echo "Updated Gradle file:"
          cat "$APP_GRADLE"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find Gradle project
        run: |
          SETTINGS_FILE="$(find project -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "Searching for APK..."

          APK_FILE="$(find "$PROJECT_DIR" -type f -path "*/app/build/outputs/apk/debug/*.apk" -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not found"
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          cp "$APK_FILE" "$GITHUB_WORKSPACE/Enshrhaa-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Enshrhaa-debug-apk
          path: Enshrhaa-debug.apk
