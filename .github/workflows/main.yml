name: Build Enshrhaa APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir -p project
          unzip -q EnshrhaaApp.zip -d project
          echo "Project files:"
          find project -maxdepth 4 -type f | head -100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find Gradle project
        run: |
          SETTINGS_FILE="$(find project -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found"
            echo "Searching for Gradle files:"
            find project -type f \( -name "build.gradle*" -o -name "settings.gradle*" \) -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find "$PROJECT_DIR" -type f -name "*.apk" -print

          APK_FILE="$(find "$PROJECT_DIR" -type f -path "*/app/build/outputs/apk/debug/*.apk" -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not found"
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          cp "$APK_FILE" "$GITHUB_WORKSPACE/Enshrhaa-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Enshrhaa-debug-apk
          path: Enshrhaa-debug.apk
